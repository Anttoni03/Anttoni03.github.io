<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRAU LifeStats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fb; --surface:#fff; --ink:#14213d; --muted:#6b7a99; --line:#dbe3f0; --head:#dbeafe;
  --event:#ffbcbc; --task:#94e498; --accent:#8f2105;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1524; --surface:#1a2238; --ink:#e8edf8; --muted:#93a1c0; --line:#2b3654; --head:#1c2a4d;
    --event:#7a3a3f; --task:#2f6b3b; --accent:#ff9b7a}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
  padding:0 0 env(safe-area-inset-bottom)}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px 28px}

/* Cabecera */
header{background:var(--head);padding:calc(14px + env(safe-area-inset-top)) 14px 14px}
.head-in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;letter-spacing:-.02em}
.week{display:flex;flex-direction:column;gap:8px;min-width:250px}
.week-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.week-top small{color:var(--muted);font-weight:400}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{height:28px;border:2px solid var(--muted);color:var(--muted);border-radius:7px;display:grid;place-items:center;font-size:.85rem;
  opacity:.55;transition:all .3s}
.day.past{border-color:var(--ink);color:var(--ink);opacity:1}
.day.now{border:3px solid var(--accent);color:var(--accent);font-weight:800;opacity:1}

/* Barra de reparto semanal */
.mix{margin:18px 0 6px}
.mix-bar{display:flex;height:22px;border-radius:11px;overflow:hidden;background:var(--line)}
.mix-bar span{transition:flex-grow .6s ease}
.mix-note{font-size:.85rem;color:var(--muted);margin:6px 2px 0}

/* Categorías */
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-top:14px}
.pill{display:flex;border-radius:8px;overflow:hidden;background:var(--surface);border:1px solid var(--line);min-height:72px}
.pill-name{flex:1;display:flex;align-items:center;padding:0 14px;font-size:1.35rem;font-weight:600;color:#14213d;border-left:8px solid var(--c)}
.pill-time{width:34%;min-width:112px;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.pill-time div{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:1.15rem}
.pill-time .now{background:var(--surface);font-weight:800}
.pill-time .plan{background:var(--line);color:var(--muted)}
.pill-time i{font-style:normal;font-size:.7rem;color:var(--muted);font-weight:400}

/* Eventos y tareas */
.lists{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:22px}
@media(max-width:700px){.lists{grid-template-columns:1fr}}
.list{background:var(--head);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.list h2{margin:0 2px 2px;font-size:1.05rem;font-weight:600}
.item{border-radius:6px;padding:12px 14px;font-size:1.15rem;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#14213d}
.item.ev{background:var(--event)} .item.tk{background:var(--task)}
@media(prefers-color-scheme:dark){.item{color:#fff}}
.item.done span:first-child{text-decoration:line-through;opacity:.6}
.chip{font-size:.8rem;font-weight:600;border:1.5px solid currentColor;border-radius:99px;padding:1px 9px;white-space:nowrap}
.empty{color:var(--muted);padding:8px 4px}

/* Estados */
.status{text-align:center;color:var(--muted);padding:12px;font-size:.95rem}
.status button{font:inherit;margin-left:8px;padding:4px 12px;border-radius:6px;border:1px solid var(--muted);background:none;color:var(--ink);cursor:pointer}
.status button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.skeleton .pill{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <h1>FRAU LifeStats</h1>
    <div class="week">
      <div class="week-top"><span id="dayText">—</span><small id="pctText"></small></div>
      <div class="days" id="days"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="mix" aria-label="Reparto de la semana">
    <div class="mix-bar" id="mixBar"></div>
    <p class="mix-note">Reparto del plan semanal por categoría</p>
  </div>
  <div class="status" id="status" role="status">Cargando datos… ⏳</div>
  <section class="grid skeleton" id="grid"></section>
  <div class="lists">
    <section class="list" id="evBox" hidden><h2>Eventos</h2><div id="events"></div></section>
    <section class="list" id="tkBox" hidden><h2>Tareas</h2><div id="tasks"></div></section>
  </div>
</main>

<script>
/* ---------- Configuración ---------- */
const CONFIG = {
  url: "https://script.google.com/macros/s/AKfycbxK-mGGAQ3n2yJeYWvStda7tQ2cwiiYEx7O4nkDF1Oo3f6sToqpvflMxdPg8tzdRtpWbg/exec",
  weekStart: [2025, 12, 26],        // [año, mes, día] de la fila 0 de la hoja
  refreshMs: 5 * 60 * 1000,         // refresco automático
  cacheKey: "lifestats:v2"
};

// Una sola lista para todas las categorías: añadir una nueva = una línea.
const CATS = [
  { label: "Dormir",       k: "dorPV",  c: "#ffb114" },
  { label: "Productivo",   k: "proPV",  c: "#673ab7" },
  { label: "Ocio",         k: "ociPV",  c: "#009689" },
  { label: "Ejercicio",    k: "ejePV",  c: "#acc34a" },
  { label: "Clarinete",    k: "clarPV", c: "#f53639" },
  { label: "Piano",        k: "piaPV",  c: "#e91eb0" },
  { label: "Leer",         k: "leePV",  c: "#50afed" },
  { label: "Social",       k: "socPV",  c: "#036ef4" },
  { label: "Transporte",   k: "traPV",  c: "#785248" },
  { label: "Comer",        k: "comPV",  c: "#ffcf1d" },
  { label: "Game develop", k: "devPV",  c: "#9c27b0" },
  { label: "Forja",        k: "forPV",  c: "#cc6550" },
  { label: "Nada",         k: "nadPV",  c: "#9a9a9a" }
];

/* ---------- Utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
const DAYS_ES = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const STRIP = ["S","D","L","M","X","J","V"];           // la semana empieza en sábado

function fmt(min) {
  if (!Number.isFinite(min)) return "--:--";
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}

// Día de la semana (0 = sábado … 6 = viernes) y avance continuo (0–1)
function weekProgress(now = new Date()) {
  const dayIdx = (now.getDay() + 1) % 7;
  const frac = (now.getHours() * 60 + now.getMinutes()) / 1440;
  return { dayIdx, advancement: (dayIdx + frac) / 7 };
}

// Índice de semana usando fechas locales (evita desfases por zona horaria / horario de verano)
function weekIndex(now = new Date()) {
  const [y, m, d] = CONFIG.weekStart;
  const start = new Date(y, m - 1, d);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor(Math.round((today - start) / 864e5) / 7);
}

// "Texto día 12. Otra cosa*" → [{text, day, done}]
function parseItems(raw) {
  return String(raw || "").split(". ").map(s => s.trim().replace(/\.$/, "")).filter(Boolean).map(s => {
    let done = false;
    if (s.endsWith("*")) { done = true; s = s.slice(0, -1).trim(); }
    const w = s.split(" ");
    let day = null;
    if (w.length > 2 && w[w.length - 2] === "día") { day = w.pop(); w.pop(); s = w.join(" "); }
    return { text: s, day, done };
  });
}

/* ---------- Pintado ---------- */
function buildGrid() {
  $("grid").innerHTML = CATS.map(c => `
    <article class="pill" style="--c:${c.c}">
      <div class="pill-name" style="background:color-mix(in srgb, ${c.c} 35%, white)">${esc(c.label)}</div>
      <div class="pill-time">
        <div class="now" id="r-${c.k}">--:--</div>
        <div class="plan" id="x-${c.k}">--:--</div>
      </div>
    </article>`).join("");
  $("mixBar").innerHTML = CATS.map(c => `<span id="m-${c.k}" style="background:${c.c};flex-grow:0" title="${esc(c.label)}"></span>`).join("");
}

function renderWeekStrip() {
  const { dayIdx, advancement } = weekProgress();
  $("dayText").textContent = DAYS_ES[new Date().getDay()];
  $("pctText").textContent = Math.round(advancement * 100) + "% de la semana";
  $("days").innerHTML = STRIP.map((l, i) =>
    `<div class="day ${i < dayIdx ? "past" : i === dayIdx ? "now" : ""}">${l}</div>`).join("");
}

function renderList(boxId, listId, raw, cls) {
  const items = parseItems(raw);
  $(boxId).hidden = !items.length;
  $(listId).innerHTML = items.map(it => `
    <p class="item ${cls}${it.done ? " done" : ""}" style="margin:0 0 8px">
      <span>${esc(it.text)}</span>${it.day ? `<span class="chip">Día ${esc(it.day)}</span>` : ""}
    </p>`).join("");
}

function render(data) {
  const row = data[weekIndex()];
  if (!row) throw new Error("No hay fila en la hoja para esta semana (índice " + weekIndex() + ")");
  const { advancement } = weekProgress();
  const total = CATS.reduce((s, c) => s + (Number(row[c.k]) || 0), 0) || 1;

  for (const c of CATS) {
    const pv = Number(row[c.k]);
    $("x-" + c.k).textContent = fmt(pv);
    $("r-" + c.k).textContent = fmt(pv * advancement);
    $("m-" + c.k).style.flexGrow = ((pv || 0) / total).toFixed(4);
  }
  renderList("evBox", "events", row.COMENTARIOS, "ev");
  renderList("tkBox", "tasks", row.TAREAS, "tk");
  $("grid").classList.remove("skeleton");
}

/* ---------- Datos ---------- */
const store = {
  get() { try { return JSON.parse(localStorage.getItem(CONFIG.cacheKey)); } catch { return null; } },
  set(v) { try { localStorage.setItem(CONFIG.cacheKey, JSON.stringify(v)); } catch {} }
};

function demoData() {
  const d = []; d[weekIndex()] = { dorPV: 3360, proPV: 1500, ociPV: 900, ejePV: 360, clarPV: 240, piaPV: 180, leePV: 300,
    socPV: 420, traPV: 200, comPV: 600, devPV: 480, forPV: 120, nadPV: 60,
    COMENTARIOS: "Cumpleaños de Marta día 12. Concierto día 14", TAREAS: "Entregar informe día 11*. Practicar escalas. Comprar cañas día 13" };
  return d;
}

async function load() {
  const status = $("status");
  renderWeekStrip();
  const cached = store.get();
  if (cached && $("grid").classList.contains("skeleton")) {            // pintar al instante lo último conocido
    try { render(cached.data); status.textContent = "Actualizando…"; } catch {}
  }
  try {
    let data;
    if (new URLSearchParams(location.search).has("demo")) data = demoData();
    else {
      const res = await fetch(CONFIG.url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      data = await res.json();
      store.set({ data, at: Date.now() });
    }
    render(data);
    status.textContent = "Actualizado a las " + new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
  } catch (err) {
    console.error(err);
    const when = cached ? new Date(cached.at).toLocaleString("es-ES", { hour: "2-digit", minute: "2-digit", day: "numeric", month: "short" }) : null;
    status.innerHTML = esc(cached ? "Sin conexión con la hoja. Mostrando datos de " + when : "No se pudieron cargar los datos: " + err.message)
      + ' <button id="retry">Reintentar</button>';
    $("retry").onclick = load;
  }
}

buildGrid();
load();
setInterval(load, CONFIG.refreshMs);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
